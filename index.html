<!DOCTYPE html>

<html lang="pl">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Bliżej córek ✦</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a120a;
    --bg2: #0d180d;
    --bg3: #101f10;
    --border: #1e2e1e;
    --border2: #2a3e2a;
    --border3: #3a5a3a;
    --accent: #6aaa50;
    --accent2: #4a8a38;
    --text: #d8f0d0;
    --text2: #8ab88a;
    --text3: #5a7a5a;
    --text4: #3a5a3a;
    --both: #8fa882;
    --older: #7a9e9f;
    --younger: #c4956a;
    --presence: #9b8ea8;
    --closeness: #c4956a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'EB Garamond', Georgia, serif; font-size: 16px; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; }

/* HEADER */
#header { padding: 24px 20px 0; border-bottom: 1px solid var(–border); flex-shrink: 0; }
#header h1 { font-family: ‘Cormorant Garamond’, Georgia, serif; font-size: 26px; font-weight: 300; letter-spacing: 0.06em; color: var(–text); }
#header h1 span { color: var(–accent); }
#subtitle { font-size: 11px; color: var(–accent); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
#level-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
#level-icon { font-size: 22px; color: var(–accent); }
#level-badge { font-size: 11px; color: var(–accent); border: 1px solid var(–border2); padding: 3px 12px; border-radius: 20px; letter-spacing: 0.08em; }
#xp-text { font-size: 12px; color: var(–text3); margin-left: auto; text-align: right; }
#progress-bar { height: 2px; background: var(–border); margin: 10px 0 0; overflow: hidden; }
#progress-fill { height: 100%; background: linear-gradient(90deg, #3a7a3a, var(–accent)); transition: width 0.8s ease; }

/* TABS */
#tabs { display: flex; }
.tab-btn { flex: 1; padding: 12px 8px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; background: none; border: none; color: var(–text4); border-bottom: 2px solid transparent; font-family: ‘EB Garamond’, Georgia, serif; transition: all 0.2s; position: relative; }
.tab-btn.active { color: var(–accent); border-bottom-color: var(–accent); }
.tab-badge { background: var(–accent); color: var(–bg); border-radius: 10px; font-size: 9px; padding: 1px 5px; margin-left: 4px; }

/* CONTENT */
#content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#content::-webkit-scrollbar { width: 3px; }
#content::-webkit-scrollbar-track { background: var(–bg); }
#content::-webkit-scrollbar-thumb { background: var(–border2); border-radius: 2px; }

/* FILTERS */
#filters { display: flex; gap: 8px; padding: 14px 20px 8px; flex-wrap: wrap; }
.filter-btn { padding: 5px 14px; font-size: 11px; border-radius: 20px; cursor: pointer; border: 1px solid var(–border2); background: transparent; color: var(–text3); font-family: ‘EB Garamond’, Georgia, serif; transition: all 0.2s; letter-spacing: 0.04em; }
.filter-btn.active { border-color: var(–accent); background: #1a2e1a; color: var(–accent); }

/* CARDS GRID */
#cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 20px 32px; }
@media (max-width: 380px) { #cards-grid { grid-template-columns: 1fr; } }

.card { background: var(–bg2); border-radius: 8px; padding: 14px 14px 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; border: 1px solid transparent; }
.card:active { background: var(–bg3); }
.card-accent { position: absolute; top: 0; left: 0; width: 3px; height: 100%; border-radius: 3px 0 0 3px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.who-tag { font-size: 9px; letter-spacing: 0.06em; border: 1px solid; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.cat-tag { font-size: 9px; opacity: 0.75; }
.card-title { font-size: 13px; color: var(–text); line-height: 1.4; margin-bottom: 6px; }
.card-desc { font-size: 11px; color: var(–text4); line-height: 1.5; }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.card-dots { font-size: 9px; color: var(–text4); letter-spacing: 2px; }
.xp-badge { font-size: 10px; color: var(–accent); background: #1a2e1a; padding: 2px 7px; border-radius: 10px; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 60px 24px; color: var(–text4); }
.empty-icon { font-size: 36px; margin-bottom: 14px; }
.empty-text { font-size: 14px; line-height: 1.7; }
.empty-sub { font-size: 12px; margin-top: 6px; opacity: 0.6; font-style: italic; }

/* MINE & DONE LISTS */
.list-item { background: var(–bg2); border: 1px solid var(–border2); border-radius: 8px; padding: 16px; margin: 0 20px 10px; animation: fadeIn 0.3s ease; }
.list-item-title { font-size: 15px; color: var(–text); margin-bottom: 6px; }
.list-item-desc { font-size: 13px; color: var(–text3); line-height: 1.6; margin-bottom: 14px; }
.list-item-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

.done-item { background: var(–bg); border: 1px solid var(–border); border-radius: 8px; padding: 12px 16px; margin: 0 20px 8px; display: flex; justify-content: space-between; align-items: center; opacity: 0.6; }
.done-title { font-size: 13px; color: var(–text4); text-decoration: line-through; }
.done-sub { font-size: 10px; color: var(–text4); margin-top: 2px; }
.done-xp { font-size: 11px; color: var(–text4); }

/* BUTTONS */
.btn-primary { background: var(–accent); border: none; color: var(–bg); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 12px; letter-spacing: 0.1em; font-family: ‘EB Garamond’, Georgia, serif; font-weight: 500; transition: all 0.2s; }
.btn-primary:active { background: var(–accent2); }
.btn-secondary { background: #1a2e1a; border: 1px solid var(–border3); color: var(–accent); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 12px; letter-spacing: 0.1em; font-family: ‘EB Garamond’, Georgia, serif; transition: all 0.2s; }
.btn-secondary:active { background: #1e3a1e; }
.btn-secondary:disabled { color: var(–text4); border-color: var(–border); cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }

/* MODAL */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: flex-end; justify-content: center; }
#modal-overlay.open { display: flex; }
#modal-box { background: var(–bg2); border: 1px solid var(–border2); border-radius: 16px 16px 0 0; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 28px 24px 40px; animation: slideUp 0.3s ease; }
#modal-box::-webkit-scrollbar { width: 3px; }
#modal-box::-webkit-scrollbar-thumb { background: var(–border2); }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.modal-title { font-family: ‘Cormorant Garamond’, Georgia, serif; font-size: 22px; font-weight: 300; color: var(–text); line-height: 1.3; max-width: 360px; }
.close-btn { background: none; border: none; color: var(–text3); cursor: pointer; font-size: 26px; line-height: 1; padding: 0 4px; }
.modal-desc { font-size: 14px; color: var(–text2); line-height: 1.75; margin-bottom: 22px; border-left: 2px solid var(–border2); padding-left: 14px; font-style: italic; }
.reflection-label { font-size: 10px; color: var(–text4); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
textarea { width: 100%; background: var(–bg); border: 1px solid var(–border2); border-radius: 6px; color: var(–text); padding: 12px; font-size: 14px; font-family: ‘EB Garamond’, Georgia, serif; line-height: 1.6; resize: vertical; min-height: 100px; outline: none; transition: border-color 0.2s; }
textarea:focus { border-color: var(–border3); }

/* AI RESPONSE BOX */
#ai-box { margin-top: 20px; background: #0a150a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 18px; animation: fadeIn 0.4s ease; display: none; }
#ai-box.visible { display: block; }
#ai-text { font-size: 14px; color: #90c090; line-height: 1.75; font-style: italic; }
#ai-new-challenge { margin-top: 16px; padding: 14px; background: var(–bg2); border-radius: 6px; border: 1px solid var(–border3); display: none; }
#ai-new-challenge.visible { display: block; }
.ai-new-label { font-size: 10px; color: var(–accent); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
#ai-new-title { font-size: 15px; color: var(–text); margin-bottom: 6px; }
#ai-new-desc { font-size: 13px; color: var(–text3); line-height: 1.6; }
.ai-saved-note { font-size: 11px; color: var(–text4); margin-top: 10px; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.loading { animation: pulse 1.4s ease-in-out infinite; }

/* SECTION PADDING */
.section-pad { padding-top: 14px; }
</style>

</head>
<body>

<!-- HEADER -->

<div id="header">
  <h1>Bliżej córek <span>✦</span></h1>
  <div id="subtitle">journey ku bliskości</div>
  <div id="level-row">
    <span id="level-icon">◌</span>
    <span id="level-badge">Obserwatorka</span>
    <span id="xp-text">0 XP</span>
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="todo" onclick="switchTab('todo')">Do zrobienia</button>
    <button class="tab-btn" data-tab="mine" onclick="switchTab('mine')">Moje zadania<span id="mine-badge" class="tab-badge" style="display:none">0</span></button>
    <button class="tab-btn" data-tab="done" onclick="switchTab('done')">Zrobione</button>
  </div>
</div>

<!-- CONTENT -->

<div id="content">

  <!-- TAB: TODO -->

  <div id="tab-todo">
    <div id="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Wszystkie</button>
      <button class="filter-btn" data-filter="both" onclick="setFilter('both')">Obie</button>
      <button class="filter-btn" data-filter="older" onclick="setFilter('older')">Starsza</button>
      <button class="filter-btn" data-filter="younger" onclick="setFilter('younger')">Młodsza</button>
    </div>
    <div id="cards-grid"></div>
  </div>

  <!-- TAB: MINE -->

  <div id="tab-mine" style="display:none" class="section-pad">
    <div id="mine-list"></div>
  </div>

  <!-- TAB: DONE -->

  <div id="tab-done" style="display:none" class="section-pad">
    <div id="done-list"></div>
  </div>

</div>

<!-- MODAL -->

<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal-box">
    <div class="modal-header">
      <div style="flex:1">
        <div class="modal-tags" id="modal-tags"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="reflection-label">Twoja refleksja</div>
    <textarea id="reflection-input" placeholder="Co poczułaś? Co odkryłaś? Co było trudne lub piękne…" oninput="onReflectionInput()"></textarea>
    <div class="btn-row">
      <button class="btn-secondary" id="reflect-btn" onclick="callClaude()" disabled>✦ Refleksja</button>
      <button class="btn-primary" id="complete-btn" onclick="completeModal()" style="margin-left:auto">✓ Ukończone</button>
    </div>
    <div id="ai-box">
      <div id="ai-text"></div>
      <div id="ai-new-challenge">
        <div class="ai-new-label">✦ nowe zadanie dla Ciebie</div>
        <div id="ai-new-title"></div>
        <div id="ai-new-desc"></div>
        <div class="ai-saved-note">→ zapisano w zakładce „Moje zadania"</div>
      </div>
    </div>
  </div>
</div>

<script>
const LEVELS = [
  { name: "Obserwatorka", min: 0, icon: "◌" },
  { name: "Obecna Mama", min: 80, icon: "◎" },
  { name: "Uważna Mama", min: 200, icon: "●" },
  { name: "Bliska Mama", min: 380, icon: "◉" },
  { name: "Bezpieczna Przystań", min: 600, icon: "✦" },
];

const WHO = {
  both:    { label: "Obie",        color: "#8fa882" },
  older:   { label: "Starsza 6l.", color: "#7a9e9f" },
  younger: { label: "Młodsza 4l.", color: "#c4956a" },
};

const CAT_COLOR = { obecność: "#9b8ea8", bliskość: "#c4956a" };

const CHALLENGES = [
  { id:1,  who:"both",    cat:"obecność", lvl:1, xp:15,  title:"Podłoga zamiast kanapy",           desc:"Usiądź z dziewczynkami na podłodze bez telefonu. Daj się wciągnąć w cokolwiek robią – 10 minut." },
  { id:2,  who:"both",    cat:"bliskość", lvl:1, xp:15,  title:"Wieczorny rytuał przytulania",      desc:"Przed snem przytul każdą i powiedz jedną konkretną rzecz która Cię w niej dziś zachwyciła." },
  { id:3,  who:"both",    cat:"obecność", lvl:1, xp:20,  title:"Wspólne gotowanie",                 desc:"Ugotujcie razem coś prostego. Każda ma zadanie. Liczy się proces." },
  { id:4,  who:"older",   cat:"bliskość", lvl:1, xp:15,  title:"Zapytaj o jej ulubione",            desc:"Zapytaj o ulubiony kolor, zwierzę i jedzenie – i naprawdę słuchaj." },
  { id:5,  who:"older",   cat:"obecność", lvl:1, xp:20,  title:"15 minut tylko dla niej",           desc:"Tylko dla starszej, ona wybiera co robicie, bez telefonu i młodszej siostry." },
  { id:6,  who:"older",   cat:"bliskość", lvl:1, xp:15,  title:"Narysujcie razem cokolwiek",        desc:"Bez oceniania, bez doradzania." },
  { id:7,  who:"younger", cat:"obecność", lvl:1, xp:15,  title:"Pobaw się w jej świat",             desc:"Na jej zasadach, w jej tempie, minimum 10 minut." },
  { id:8,  who:"younger", cat:"bliskość", lvl:1, xp:15,  title:"Zbudujcie coś razem",               desc:"Wieżę, namiot, zamek. Ona decyduje jak." },
  { id:9,  who:"younger", cat:"obecność", lvl:1, xp:15,  title:"Czytaj z przerwami",                desc:"Zatrzymuj się i pytaj 'co myślisz co się stanie?'." },
  { id:10, who:"both",    cat:"bliskość", lvl:2, xp:25,  title:"Stare zdjęcie",                     desc:"Znajdź stare zdjęcie rodzinne i opowiedz co pamiętasz. Zapytaj jak one to zapamiętały." },
  { id:11, who:"both",    cat:"obecność", lvl:2, xp:25,  title:"Spacer bez celu",                   desc:"Idźcie gdzie one chcą. Nie spieszcie się." },
  { id:12, who:"both",    cat:"bliskość", lvl:2, xp:30,  title:"Wieczór bez ekranów",               desc:"Kolacja bez telewizora i telefonów." },
  { id:13, who:"older",   cat:"bliskość", lvl:2, xp:25,  title:"Co ją złości w szkole",             desc:"Wysłuchaj bez dawania rad." },
  { id:14, who:"older",   cat:"obecność", lvl:2, xp:30,  title:"Naucz się czegoś od niej",          desc:"Ona uczy, ty jesteś uczniem na serio." },
  { id:15, who:"older",   cat:"bliskość", lvl:2, xp:25,  title:"Opowiedz o swoim dzieciństwie",     desc:"Jedna historia, dostosowana do jej poziomu." },
  { id:16, who:"younger", cat:"bliskość", lvl:2, xp:25,  title:"Stwórzcie bajkę",                   desc:"Zacznij, w połowie oddaj głos jej. Śmiej się z efektów." },
  { id:17, who:"younger", cat:"obecność", lvl:2, xp:20,  title:"Tańczcie razem",                    desc:"Jej muzyka, daj się prowadzić." },
  { id:18, who:"younger", cat:"bliskość", lvl:2, xp:30,  title:"Nazwij jej emocje",                 desc:"Przykucnij i powiedz 'Widzę że jesteś teraz…'." },
  { id:19, who:"both",    cat:"bliskość", lvl:3, xp:40,  title:"Rytuał różyczka i kolec",           desc:"Każda mówi jedną dobrą i jedną trudną rzecz z dnia. Też ty." },
  { id:20, who:"both",    cat:"obecność", lvl:3, xp:45,  title:"Dzień bez 'poczekaj'",              desc:"Za każdym razem gdy przychodzą – odkładasz co robisz." },
  { id:21, who:"both",    cat:"bliskość", lvl:3, xp:40,  title:"Wyjście tylko z nimi",              desc:"Bez partnera. One wybierają dokąd." },
  { id:22, who:"older",   cat:"bliskość", lvl:3, xp:40,  title:"Porozmawiaj o przyjaźni",           desc:"Co lubi w przyjaciółce. Czy coś w przyjaźni ją boli." },
  { id:23, who:"older",   cat:"obecność", lvl:3, xp:45,  title:"Wieczór tylko ona i ty",            desc:"Gdy młodsza śpi. Coś co jest tylko wasze." },
  { id:24, who:"younger", cat:"bliskość", lvl:3, xp:45,  title:"Zostań w trudnym momencie",         desc:"Nie uciszaj, nie odchodź. 'Jestem tu z tobą'." },
  { id:25, who:"younger", cat:"obecność", lvl:3, xp:40,  title:"Jeden poranek w jej rytmie",        desc:"Bez pośpiechu. Wstajesz wcześniej żeby dać jej czas." },
  { id:26, who:"both",    cat:"bliskość", lvl:4, xp:60,  title:"Przeproś konkretnie",               desc:"Wróć do momentu gdy straciłaś cierpliwość. 'Przepraszam za…'. Bez tłumaczeń." },
  { id:27, who:"both",    cat:"obecność", lvl:4, xp:65,  title:"Weekend bez planu",                 desc:"One decydują rano co robimy." },
  { id:28, who:"older",   cat:"bliskość", lvl:4, xp:60,  title:"Zapytaj czego się boi",             desc:"Wysłuchaj bez bagatelizowania. Powiedz o jednym własnym strachu." },
  { id:29, who:"younger", cat:"bliskość", lvl:4, xp:55,  title:"Sekretny rytuał",                   desc:"Wymyślcie coś tylko wasze – uścisk, słowo, piosenkę." },
  { id:30, who:"both",    cat:"bliskość", lvl:5, xp:90,  title:"Powiedz im czym jest bycie ich mamą", desc:"Każdej osobno. Konkretnie, bez ogólników." },
  { id:31, who:"both",    cat:"obecność", lvl:5, xp:90,  title:"Tydzień bez 'za chwilę'",           desc:"Przez tydzień zanim powiesz 'za chwilę' – oceniasz czy naprawdę nie możesz teraz." },
];

// STATE
let state = {
  xp: 0,
  doneIds: [],
  reflections: {},
  aiResponses: {},
  generated: []
};

let currentTab = 'todo';
let currentFilter = 'all';
let currentModal = null;
let isLoading = false;

// STORAGE
function saveState() {
  try {
    localStorage.setItem('bc_state', JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const s = localStorage.getItem('bc_state');
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

// LEVEL UTILS
function getCurrentLevel() {
  return LEVELS.reduce((acc, l) => state.xp >= l.min ? l : acc, LEVELS[0]);
}
function getNextLevel() {
  return LEVELS.find(l => l.min > state.xp);
}
function getProgress() {
  const cur = getCurrentLevel(), nxt = getNextLevel();
  if (!nxt) return 100;
  return Math.min(100, ((state.xp - cur.min) / (nxt.min - cur.min)) * 100);
}
function dots(lvl) {
  return Array.from({length:5}, (_,i) => i < lvl ? '●' : '○').join('');
}

// RENDER HEADER
function renderHeader() {
  const lvl = getCurrentLevel(), nxt = getNextLevel();
  document.getElementById('level-icon').textContent = lvl.icon;
  document.getElementById('level-badge').textContent = lvl.name;
  document.getElementById('xp-text').innerHTML = `${state.xp} XP${nxt ? ` &middot; do ${nxt.name}: ${nxt.min - state.xp}` : ' &middot; szczyt!'}`;
  document.getElementById('progress-fill').style.width = getProgress() + '%';
  const pending = state.generated.filter(g => !state.doneIds.includes(g.id));
  const badge = document.getElementById('mine-badge');
  if (pending.length > 0) { badge.textContent = pending.length; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }
}

// RENDER TODO
function renderTodo() {
  const grid = document.getElementById('cards-grid');
  const visible = CHALLENGES.filter(c => {
    if (state.doneIds.includes(c.id)) return false;
    if (currentFilter === 'all') return true;
    return c.who === currentFilter;
  });
  if (visible.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">◌</div><div class="empty-text">Wszystkie zadania z tej kategorii ukończone ✦</div></div>`;
    return;
  }
  grid.innerHTML = visible.map(ch => `
    <div class="card" onclick="openModal(${ch.id})" style="border-color:${WHO[ch.who].color}22">
      <div class="card-accent" style="background:${WHO[ch.who].color}"></div>
      <div class="card-top">
        <span class="who-tag" style="color:${WHO[ch.who].color};border-color:${WHO[ch.who].color}44">${WHO[ch.who].label}</span>
        <span class="cat-tag" style="color:${CAT_COLOR[ch.cat]}">${ch.cat}</span>
      </div>
      <div class="card-title">${ch.title}</div>
      <div class="card-desc">${ch.desc.length > 70 ? ch.desc.slice(0,70)+'…' : ch.desc}</div>
      <div class="card-meta">
        <span class="card-dots">${dots(ch.lvl)}</span>
        <span class="xp-badge">+${ch.xp} XP</span>
      </div>
    </div>
  `).join('');
}

// RENDER MINE
function renderMine() {
  const list = document.getElementById('mine-list');
  const pending = state.generated.filter(g => !state.doneIds.includes(g.id));
  if (pending.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">◌</div><div class="empty-text">Tutaj pojawią się zadania wygenerowane przez AI</div><div class="empty-sub">Napisz refleksję w dowolnym zadaniu i kliknij ✦ Refleksja</div></div>`;
    return;
  }
  list.innerHTML = pending.map(ch => `
    <div class="list-item">
      <div class="list-item-tags">
        <span class="who-tag" style="color:${WHO[ch.who]?.color||'#8fa882'};border-color:${WHO[ch.who]?.color||'#8fa882'}44">${WHO[ch.who]?.label||'Obie'}</span>
        <span class="cat-tag" style="color:${CAT_COLOR[ch.category||ch.cat]||'#9b8ea8'}">${ch.category||ch.cat}</span>
      </div>
      <div class="list-item-title">${ch.title}</div>
      <div class="list-item-desc">${ch.desc}</div>
      <button class="btn-primary" onclick="completeGen('${ch.id}')">✓ Ukończone +20 XP</button>
    </div>
  `).join('');
}

// RENDER DONE
function renderDone() {
  const list = document.getElementById('done-list');
  const doneCh = CHALLENGES.filter(c => state.doneIds.includes(c.id));
  const doneGen = state.generated.filter(g => state.doneIds.includes(g.id));
  if (doneCh.length === 0 && doneGen.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">◌</div><div class="empty-text">Jeszcze nic ukończonego<br>zacznij od czegoś małego</div></div>`;
    return;
  }
  list.innerHTML = [
    ...doneCh.map(ch => `
      <div class="done-item">
        <div><div class="done-title">${ch.title}</div><div class="done-sub">${WHO[ch.who].label} · ${ch.cat}</div></div>
        <span class="done-xp">+${ch.xp} XP</span>
      </div>`),
    ...doneGen.map(ch => `
      <div class="done-item" style="border-color:#1a3a2a">
        <div><div class="done-title">${ch.title}</div><div class="done-sub">✦ moje zadanie</div></div>
        <span class="done-xp">+20 XP</span>
      </div>`)
  ].join('');
}

function renderAll() {
  renderHeader();
  renderTodo();
  renderMine();
  renderDone();
}

// TAB SWITCHING
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-todo').style.display = tab === 'todo' ? '' : 'none';
  document.getElementById('tab-mine').style.display = tab === 'mine' ? '' : 'none';
  document.getElementById('tab-done').style.display = tab === 'done' ? '' : 'none';
  if (tab === 'mine') renderMine();
  if (tab === 'done') renderDone();
}

// FILTER
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderTodo();
}

// MODAL
function openModal(id) {
  const ch = CHALLENGES.find(c => c.id === id);
  if (!ch) return;
  currentModal = ch;

  document.getElementById('modal-tags').innerHTML = `
    <span class="who-tag" style="color:${WHO[ch.who].color};border-color:${WHO[ch.who].color}44">${WHO[ch.who].label}</span>
    <span class="cat-tag" style="color:${CAT_COLOR[ch.cat]}">${ch.cat}</span>
    <span class="xp-badge">+${ch.xp} XP</span>`;
  document.getElementById('modal-title').textContent = ch.title;
  document.getElementById('modal-desc').textContent = ch.desc;
  document.getElementById('reflection-input').value = state.reflections[ch.id] || '';

  const aiBox = document.getElementById('ai-box');
  const saved = state.aiResponses[ch.id];
  if (saved) {
    document.getElementById('ai-text').textContent = saved.response;
    aiBox.classList.add('visible');
    if (saved.newChallenge) {
      document.getElementById('ai-new-title').textContent = saved.newChallenge.title;
      document.getElementById('ai-new-desc').textContent = saved.newChallenge.desc;
      document.getElementById('ai-new-challenge').classList.add('visible');
    }
  } else {
    aiBox.classList.remove('visible');
    document.getElementById('ai-new-challenge').classList.remove('visible');
  }

  const isDone = state.doneIds.includes(ch.id);
  document.getElementById('complete-btn').style.display = isDone ? 'none' : '';
  document.getElementById('reflect-btn').disabled = !document.getElementById('reflection-input').value.trim() || isLoading;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentModal = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function onReflectionInput() {
  const val = document.getElementById('reflection-input').value.trim();
  document.getElementById('reflect-btn').disabled = !val || isLoading;
}

function completeModal() {
  if (!currentModal || state.doneIds.includes(currentModal.id)) return;
  state.doneIds.push(currentModal.id);
  state.xp += currentModal.xp;
  saveState();
  renderAll();
  closeModal();
}

function completeGen(id) {
  if (state.doneIds.includes(id)) return;
  state.doneIds.push(id);
  state.xp += 20;
  saveState();
  renderAll();
}

// CLAUDE API
async function callClaude() {
  const reflection = document.getElementById('reflection-input').value.trim();
  if (!reflection || !currentModal || isLoading) return;
  isLoading = true;
  const btn = document.getElementById('reflect-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading">◌ myślę…</span>';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Jesteś empatycznym towarzyszem Maty – mamy dwóch córek (6 i 4 lata), która pracuje nad byciem obecną i budowaniem bliskości z dziećmi. Odpowiadasz po polsku, ciepło i konkretnie. Zawsze odpowiadaj WYŁĄCZNIE w formacie JSON bez żadnych dodatkowych znaków ani markdown: {"response":"2-3 zdania refleksji i wsparcia","newChallenge":{"title":"krótka nazwa zadania","desc":"opis zadania do 2 zdań","who":"both|older|younger","category":"obecność|bliskość"}}`,
        messages: [{ role: 'user', content: `Zadanie: "${currentModal.title}" (${currentModal.cat}, ${WHO[currentModal.who].label})\n\nMoja refleksja: ${reflection}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    state.aiResponses[currentModal.id] = parsed;
    state.reflections[currentModal.id] = reflection;

    if (parsed.newChallenge) {
      const newGen = { ...parsed.newChallenge, id: `gen_${Date.now()}`, xp: 20, lvl: currentModal.lvl, isGenerated: true };
      state.generated.push(newGen);
    }
    saveState();

    document.getElementById('ai-text').textContent = parsed.response;
    document.getElementById('ai-box').classList.add('visible');
    if (parsed.newChallenge) {
      document.getElementById('ai-new-title').textContent = parsed.newChallenge.title;
      document.getElementById('ai-new-desc').textContent = parsed.newChallenge.desc;
      document.getElementById('ai-new-challenge').classList.add('visible');
    }
    renderHeader();
  } catch(e) {
    document.getElementById('ai-text').textContent = 'Coś poszło nie tak. Spróbuj jeszcze raz.';
    document.getElementById('ai-box').classList.add('visible');
  }

  isLoading = false;
  btn.innerHTML = '✦ Refleksja';
  btn.disabled = false;
}

// INIT
loadState();
renderAll();
</script>
